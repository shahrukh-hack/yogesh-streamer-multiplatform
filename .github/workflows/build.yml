name: Build & Deploy Yogesh Streamer Multi-Platform APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yogesh Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and Commit Permanent Keystore if not present
        run: |
          if [ ! -f release.keystore ]; then
            echo "Generating permanent release.keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias yogesh -keyalg RSA -keysize 2048 -validity 10000 -storepass yogeshstreamer123 -keypass yogeshstreamer123 -dname "CN=YogeshStreamer, OU=Streaming, O=Yogesh, L=Ahmedabad, ST=Gujarat, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.keystore
            git commit -m "🔐 Add permanent release.keystore for seamless OTA updates" || true
            git push origin HEAD:master || true
          else
            echo "Permanent release.keystore already exists. Using identical cryptographic certificate."
          fi

      - name: Build APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building Version: $VERSION_NAME"
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apks/YogeshStreamer-v${VERSION_NAME}.apk \;
          cd output_apks
          ls -lah

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogeshStreamer-APK
          path: output_apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Yogesh Streamer v${{ env.VERSION_NAME }} Multi-Platform Official Release"
          body: |
            # 🚀 Yogesh Streamer v${{ env.VERSION_NAME }} — Official Multi-Platform Release
            
            Welcome to the upgraded **Yogesh Streamer v${{ env.VERSION_NAME }}**, featuring our next-generation cloud bridge architecture!

            ### 🌟 Key Highlights in this Build:
            * **⚡ Cloud-Connected Bridge Engine:** Seamless integration with the 24/7 Yogesh Streamer Bridge for instant stream resolution.
            * **🏰 Castle Cinema (550+ Titles):** 100% instant web-playable 1080p movies and web series with multi-audio and subtitles.
            * **🏏 Universal Live Sports Hub:** Direct 1-tap live streams for DD Sports 1 HD, PlayFy live cricket, Willow Cricket HD, and SportzX.
            * **📺 Smart TV & FireStick Leanback Launcher:** Native D-Pad spatial navigation, auto-focus, and TV back key mapping.
            * **🎬 Hardware-Accelerated Playback:** Smooth 60fps hardware decoding with automatic landscape fullscreen mode.
            * **🚀 Native VLC & MX Player Launcher:** 1-tap launcher to stream directly in external players with lossless MKV support.
            * **🕉️ Sacred Intro Audio:** Plays *Om Namah Shivaya* chant on app startup.
            * **🔐 Permanent Keystore:** Identical cryptographic signature ensures seamless in-app OTA updates.
          draft: false
          prerelease: false
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
