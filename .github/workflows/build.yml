name: Build & Deploy Yogesh Streamer Multi-Platform APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yogesh Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Deterministic Keystore if not present
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias yogesh -keyalg RSA -keysize 2048 -validity 10000 -storepass yogeshstreamer123 -keypass yogeshstreamer123 -dname "CN=YogeshStreamer, OU=Streaming, O=Yogesh, L=Ahmedabad, ST=Gujarat, C=IN"
          fi

      - name: Build APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building Version: $VERSION_NAME"
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apks/YogeshStreamer-v${VERSION_NAME}.apk \;
          cd output_apks
          ls -lah

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogeshStreamer-APK
          path: output_apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Yogesh Streamer v${{ env.VERSION_NAME }} Multi-Platform Official Release"
          body: |
            # ?? Yogesh Streamer v${{ env.VERSION_NAME }} — Professional Multi-Grade Release
            
            Welcome to the upgraded **Yogesh Streamer v${{ env.VERSION_NAME }}**, built with pure native architecture!

            ### ?? Key Highlights in this Build:
            * **??? Sacred Intro Audio:** Plays *Om Namah Shivaya* chant on startup.
            * **?? Live-Tested Cricket & Sports HD:** Direct 1-tap streams for Star Sports 1 Hindi HD, Willow Cricket HD, and Astro Cricket 60fps.
            * **?? ExoPlayer Multi-Audio Track Selector:** Switch between Hindi Dubbed, Gujarati, English, Tamil, and Telugu audio tracks in 1 tap.
            * **?? Curated Deduplicated Cinema:** 380+ verified Gujarati titles, 10,400+ Bollywood hits, South Hindi Dubbed, and Hollywood 4K.
            * **?? 100% Zero Popups & Zero Ads:** Completely free of third-party Telegram or CNCV subscription dialogs.
            * **?? Fixed Package Keystore:** Deterministic signature ensures seamless future in-app updates.
          draft: false
          prerelease: false
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
