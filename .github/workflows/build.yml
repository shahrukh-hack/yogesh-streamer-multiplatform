name: Build & Deploy Yogesh Streamer Multi-Platform APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yogesh Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Deterministic Keystore if not present
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias yogesh -keyalg RSA -keysize 2048 -validity 10000 -storepass yogeshstreamer123 -keypass yogeshstreamer123 -dname "CN=YogeshStreamer, OU=Streaming, O=Yogesh, L=Ahmedabad, ST=Gujarat, C=IN"
          fi

      - name: Build APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apks/YogeshStreamer-v1.0.0.apk \;

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogeshStreamer-v1.0.0-APK
          path: output_apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Yogesh Streamer v1.0.0 Multi-Platform Official Release
          body: |
            # ?? Yogesh Streamer v1.0.0 — Multi-Platform Edition
            
            Welcome to the brand new **Yogesh Streamer v1.0.0**, built from scratch with clean cross-platform architecture!

            ### ?? Key Highlights:
            * **?? Live Cricket & Sports:** Direct 1-tap live streams powered by **Cricify, Sktech & Sportzx** (Star Sports Hindi, Willow HD, Astro Cricket, Sony Ten).
            * **?? Pure Categorized Movies:** Powered by **CastleTV, VidSrc & AutoEmbed** with separate rows for **Gujarati Blockbusters**, **Bollywood Hits**, **South Hindi Dubbed**, and **Hollywood 4K**.
            * **??? 100% Ad & Popup-Free:** Zero CNCverse popups, zero Telegram ads, zero subscription dialogs.
            * **??? Sacred Audio:** Guaranteed **Om Namah Shivaya** startup audio on launch.
            * **???? Universal Compatibility:** Full Android Phone, Tablet, Android TV, and Amazon FireStick D-Pad remote support.
            * **?? Seamless Updates:** Consistent package signing prevents all future package conflict errors.
          draft: false
          prerelease: false
          files: output_apks/YogeshStreamer-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
