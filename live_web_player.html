<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?? Yogesh Streamer v1.0 — Live Web Player</title>
    <!-- HLS.js Video Engine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0A0E17; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { background: #121824; border-bottom: 1px solid #1A2234; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-crest { width: 44px; height: 44px; border-radius: 10px; border: 2px solid #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .logo-title { font-size: 20px; font-weight: 800; color: #FFD700; letter-spacing: 1px; }
        .logo-subtitle { font-size: 11px; color: #00E5FF; font-weight: 600; }
        .live-badge { background: #FF2E56; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Main Container */
        .container { display: flex; flex: 1; padding: 20px; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        /* Video Player Area */
        .player-section { flex: 2.5; background: #121824; border-radius: 16px; border: 1px solid #1E283C; overflow: hidden; display: flex; flex-direction: column; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .player-info { padding: 18px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1A2234; }
        .match-title { font-size: 18px; font-weight: 700; color: #FFFFFF; }
        .match-meta { font-size: 12px; color: #00E5FF; margin-top: 4px; }

        /* Channels & Server Switcher Sidebar */
        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 14px; }
        .sidebar-card { background: #121824; border-radius: 14px; border: 1px solid #1E283C; padding: 16px; }
        .sidebar-title { font-size: 14px; font-weight: 700; color: #FFD700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .channel-btn { width: 100%; background: #1A2234; border: 1px solid #2A364F; color: #FFF; padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .channel-btn:hover, .channel-btn.active { background: rgba(255, 215, 0, 0.12); border-color: #FFD700; color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .channel-name { font-weight: 600; font-size: 13px; }
        .channel-tag { font-size: 10px; background: #00E5FF; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 700; }

        .server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .server-btn { background: #1E283C; border: 1px solid #2A364F; color: #B0B8C4; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; transition: all 0.2s; }
        .server-btn:hover, .server-btn.active { background: #00E5FF; color: #000; border-color: #00E5FF; }

        /* Spiritual Audio Banner */
        .audio-banner { background: linear-gradient(90deg, #1A2234, #121824); border-radius: 12px; border: 1px solid rgba(255, 215, 0, 0.3); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .audio-text { font-size: 12px; color: #FFD700; font-weight: 600; }
        .audio-btn { background: #FFD700; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="app/src/main/res/drawable/splash_logo.png" alt="Y+M Logo" class="logo-crest">
            <div>
                <div class="logo-title">YOGESH STREAMER</div>
                <div class="logo-subtitle">Live Multi-Platform Stream Player v1.0</div>
            </div>
        </div>
        <div class="live-badge">? LIVE BROADCAST</div>
    </header>

    <div class="container">
        <!-- Live Video Area -->
        <div class="player-section">
            <div class="video-wrapper">
                <video id="liveVideo" controls autoplay playsinline></video>
            </div>
            <div class="player-info">
                <div>
                    <div class="match-title" id="currentTitle">Star Sports 1 Hindi HD — Live Cricket Stream</div>
                    <div class="match-meta" id="currentMeta">Powered by Cricify & Sktech Engine • 1080p 60fps • 0% Ads</div>
                </div>
            </div>
        </div>

        <!-- Channel & Server Selector Sidebar -->
        <div class="sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">?? LIVE CRICKET CHANNELS</div>
                
                <button class="channel-btn active" onclick="loadChannel('Star Sports 1 Hindi HD', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', '1080p', this)">
                    <span class="channel-name">???? Star Sports 1 Hindi HD</span>
                    <span class="channel-tag">LIVE</span>
                </button>

                <button class="channel-btn" onclick="loadChannel('Willow Cricket HD', 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8', '1080p', this)">
                    <span class="channel-name">?? Willow Cricket HD</span>
                    <span class="channel-tag">1080P</span>
                </button>

                <button class="channel-btn" onclick="loadChannel('Astro Cricket 1080p 60fps', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', '60FPS', this)">
                    <span class="channel-name">?? Astro Cricket HD</span>
                    <span class="channel-tag">60FPS</span>
                </button>

                <button class="channel-btn" onclick="loadChannel('Sony Sports Ten 3 (Hindi)', 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8', '1080p', this)">
                    <span class="channel-name">?? Sony Sports Ten 3 HD</span>
                    <span class="channel-tag">HINDI</span>
                </button>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-title">? CRICIFY / SKTECH SERVERS</div>
                <div class="server-grid">
                    <button class="server-btn active" onclick="switchServer('Cricify Primary 1080p', this)">Server 1 (Cricify)</button>
                    <button class="server-btn" onclick="switchServer('Sktech Fast CDN', this)">Server 2 (Sktech)</button>
                    <button class="server-btn" onclick="switchServer('Sportzx Backup', this)">Server 3 (Sportzx)</button>
                    <button class="server-btn" onclick="switchServer('CastleTV Direct', this)">Server 4 (CastleTV)</button>
                </div>
            </div>

            <div class="audio-banner">
                <div class="audio-text">??? Sacred Om Namah Shivaya Sound</div>
                <button class="audio-btn" onclick="toggleSpiritualSound()">? Play</button>
                <audio id="spiritualAudio" src="app/src/main/res/raw/om_namah_shivaya.mp3"></audio>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('liveVideo');
        let hls = null;

        function loadStream(url) {
            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => {});
                });
            }
        }

        function loadChannel(title, streamUrl, quality, btn) {
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentMeta').innerText = 'Powered by Cricify & Sktech Engine • ' + quality + ' • 0% Ads';
            loadStream(streamUrl);
        }

        function switchServer(serverName, btn) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Re-loads current stream with server priority
            const activeChannel = document.querySelector('.channel-btn.active');
            if (activeChannel) { activeChannel.click(); }
        }

        function toggleSpiritualSound() {
            const audio = document.getElementById('spiritualAudio');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
                audio.currentTime = 0;
            }
        }

        // Initialize default channel
        loadStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
    </script>
</body>
</html>
